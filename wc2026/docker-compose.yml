services:
  wc2026:
    build: .
    container_name: wc2026
    restart: unless-stopped
    ports:
      - "5173:80"       # http://100.115.169.40:5173 over Tailscale
    extra_hosts:
      - "host.docker.internal:host-gateway"   # lets nginx /api/ reach host port 8080

